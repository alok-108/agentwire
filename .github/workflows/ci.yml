name: AgentWire CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  rust-and-python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Cargo workspace tests (incl. proptest fuzzing)
        env:
          PYO3_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: cargo test --workspace

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Build PyO3 release wheel & run pytest + benchmark
        shell: bash
        env:
          PYO3_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: |
          uv venv --python "${{ steps.setup-python.outputs.python-path }}" .venv
          if [ -f .venv/Scripts/python.exe ]; then
            PY=.venv/Scripts/python.exe
            MATURIN=.venv/Scripts/maturin.exe
            PYTEST=.venv/Scripts/pytest.exe
          else
            PY=.venv/bin/python
            MATURIN=.venv/bin/maturin
            PYTEST=.venv/bin/pytest
          fi
          uv pip install --python "$PY" maturin pytest tiktoken langgraph
          "$MATURIN" develop --release
          "$PYTEST"
          "$PY" benchmarks/token_latency_bench.py --iterations 100

  dashboard-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install & build React dashboard
        run: |
          npm install
          npm run build
