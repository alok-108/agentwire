[workspace]
resolver = "2"
members = [
    "crates/agentwire-core",
    "crates/agentwire-validator",
    "crates/agentwire-py",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/alok-108/agentwire"
authors = ["AgentWire Contributors"]

[workspace.dependencies]
crc32fast = "1.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
pyo3 = "0.24"
