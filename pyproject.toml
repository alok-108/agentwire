[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "agentwire"
version = "0.2.0"
description = "A compact, cryptographically verifiable binary wire protocol and deterministic policy runtime for multi-agent AI systems."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "AgentWire Contributors" }]
keywords = ["ai-agents", "multi-agent", "rpc", "protocol", "langgraph", "crewai", "rust"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "maturin>=1.7,<2.0",
    "pytest>=8.0",
    "tiktoken>=0.7",
]
langgraph = ["langgraph>=0.2"]
crewai = ["crewai>=0.80"]

[project.urls]
Repository = "https://github.com/alok-108/agentwire"

[tool.maturin]
manifest-path = "crates/agentwire-py/Cargo.toml"
python-source = "python"
module-name = "agentwire._agentwire"
features = ["extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
