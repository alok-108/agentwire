[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "swarmwire"
version = "0.2.1"
description = "A compact, cryptographically verifiable binary wire protocol and deterministic policy runtime for multi-agent AI systems."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.14"
authors = [{ name = "Alok Pandey", email = "166419621+alok-108@users.noreply.github.com" }]
keywords = [
    "ai-agents",
    "multi-agent",
    "rpc",
    "binary-protocol",
    "langgraph",
    "crewai",
    "rust",
    "pyo3",
    "policy-engine",
    "observability",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
    "Topic :: Security :: Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "maturin>=1.7,<2.0",
    "pytest>=8.0",
    "tiktoken>=0.7",
]
langgraph = ["langgraph>=0.2"]
crewai = ["crewai>=0.80"]

[project.urls]
Homepage = "https://github.com/alok-108/agentwire"
Repository = "https://github.com/alok-108/agentwire"
Issues = "https://github.com/alok-108/agentwire/issues"
Changelog = "https://github.com/alok-108/agentwire/releases"

[tool.maturin]
manifest-path = "crates/agentwire-py/Cargo.toml"
python-source = "python"
module-name = "agentwire._agentwire"
features = ["extension-module"]
include = [
    { path = "LICENSE", format = ["sdist", "wheel"] },
    { path = "README.md", format = ["sdist", "wheel"] },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
