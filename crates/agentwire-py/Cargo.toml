[package]
name = "agentwire-py"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "PyO3 Python bindings for AgentWire Rust core and policy validator."

[lib]
name = "_agentwire"
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
agentwire-core = { path = "../agentwire-core" }
agentwire-validator = { path = "../agentwire-validator" }
pyo3.workspace = true
serde_json.workspace = true
